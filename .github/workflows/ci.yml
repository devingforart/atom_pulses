name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure core
        run: cmake -S . -B build/core -DPULSO_BUILD_PLUGIN=OFF
      - name: Build core
        run: cmake --build build/core --config Release --parallel
      - name: Test core
        run: ctest --test-dir build/core -C Release --output-on-failure

  plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure plugin
        run: cmake --preset windows-release
      - name: Build plugin
        run: cmake --build --preset windows-release --parallel
      - name: Test
        run: ctest --preset windows-release
        
      # CD: Guardar el artefacto final para poder descargarlo
      - name: Upload VST3 Plugin
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AtomPulses-Windows-VST3
          path: "**/*.vst3"