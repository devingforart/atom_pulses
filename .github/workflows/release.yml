name: Release PULSO

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag (vX.Y.Z)
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: pulso-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          {
            submodules: recursive,
            ref: "${{ env.RELEASE_TAG }}",
            fetch-depth: 0,
          }
      - name: Verify release identity
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Release tag must be semantic.' }
          $cmake = Get-Content CMakeLists.txt -Raw
          $version = [regex]::Match($cmake, 'project\(Pulso\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)').Groups[1].Value
          if ("v$version" -ne $env:RELEASE_TAG) { throw "Tag $env:RELEASE_TAG does not match PULSO $version" }
      - name: Configure and build
        run: |
          cmake --preset windows-release
          cmake --build --preset windows-release --target Pulso_VST3 Pulso_Standalone --parallel
      - name: Test
        run: ctest --preset windows-release --output-on-failure
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Verify commercial release credentials
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          INNO_LICENSE_KEY: ${{ secrets.INNO_SETUP_LICENSE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) { throw 'WINDOWS_CERTIFICATE_BASE64 is required for a public release.' }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_PASSWORD)) { throw 'WINDOWS_CERTIFICATE_PASSWORD is required for a public release.' }
          if ([string]::IsNullOrWhiteSpace($env:INNO_LICENSE_KEY)) { throw 'INNO_SETUP_LICENSE_KEY is required for a commercial release.' }
          reg add 'HKCU\Software\Jordan Russell\Inno Setup\License' /v LicenseKey /t REG_SZ /d $env:INNO_LICENSE_KEY /f | Out-Null
      - name: Materialize signing certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'pulso-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "PULSO_CERTIFICATE_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build signed installer
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $arguments = @{ Configuration = 'Release' }
          if ($env:PULSO_CERTIFICATE_PATH) {
            $arguments.CertificatePath = $env:PULSO_CERTIFICATE_PATH
            $arguments.CertificatePassword = $env:CERTIFICATE_PASSWORD
          }
          ./scripts/build-installer.ps1 @arguments
          ./scripts/package.ps1 -Configuration Release
      - name: Verify Authenticode policy
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter '*.exe' | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid signature: $($_.Name) ($($signature.Status))" }
          }
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/PULSO-${{ env.RELEASE_TAG }}-sbom.cdx.json
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/PULSO-*-windows-x64-setup.exe
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-${{ env.RELEASE_TAG }}-windows-x64
          if-no-files-found: error
          path: |
            dist/PULSO-*-windows-x64-setup.exe
            dist/PULSO-*-windows-x64-setup.exe.sha256
            dist/PULSO-*-windows-x64.zip
            dist/PULSO-*-windows-x64.zip.sha256
            dist/*-sbom.cdx.json
      - name: Publish immutable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:RELEASE_TAG dist/PULSO-*-windows-x64-setup.exe dist/PULSO-*-windows-x64-setup.exe.sha256 dist/PULSO-*-windows-x64.zip dist/PULSO-*-windows-x64.zip.sha256 dist/*-sbom.cdx.json --verify-tag --generate-notes --title "PULSO $($env:RELEASE_TAG.TrimStart('v'))"
      - name: Remove transient certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:PULSO_CERTIFICATE_PATH) { Remove-Item -LiteralPath $env:PULSO_CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue }
          reg delete 'HKCU\Software\Jordan Russell\Inno Setup\License' /v LicenseKey /f 2>$null
          exit 0
