name: Release PULSO

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag (vX.Y.Z)
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: pulso-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          {
            submodules: recursive,
            ref: "${{ env.RELEASE_TAG }}",
            fetch-depth: 0,
          }
      - name: Verify release identity
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Release tag must be semantic.' }
          $cmake = Get-Content CMakeLists.txt -Raw
          $version = [regex]::Match($cmake, 'project\(Pulso\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)').Groups[1].Value
          if ("v$version" -ne $env:RELEASE_TAG) { throw "Tag $env:RELEASE_TAG does not match PULSO $version" }
      - name: Configure and build
        run: |
          # Keep the release configure path identical to the plug-in CI job.
          # This avoids runner-specific preset resolution while still producing
          # the same Release artefacts and test configuration.
          cmake -S . -B build/windows-release -DPULSO_BUILD_PLUGIN=ON -DPULSO_BUILD_TESTS=ON
          cmake --build build/windows-release --config Release --target Pulso_VST3 Pulso_Standalone pulso_tests pulso_processor_tests --parallel
      - name: Test
        run: ctest --test-dir build/windows-release -C Release --output-on-failure
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Build unsigned beta installer
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Configuration Release
          ./scripts/package.ps1 -Configuration Release
      - name: Verify unsigned artifact and checksums
        shell: pwsh
        run: |
          foreach ($artifact in Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(exe|zip)$' }) {
            $hashFile = "$($artifact.FullName).sha256"
            if (-not (Test-Path -LiteralPath $hashFile)) { throw "Missing checksum for $($artifact.Name)" }
            $expected = (Get-Content -LiteralPath $hashFile -Raw).Trim().Split(' ')[0]
            $actual = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash
            if ($expected -ne $actual) { throw "Checksum mismatch: $($artifact.Name)" }
          }
          $installer = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer missing' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'NotSigned') { throw "Unexpected signature state: $($signature.Status)" }
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/PULSO-${{ env.RELEASE_TAG }}-sbom.cdx.json
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/PULSO-*-windows-x64-setup.exe
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PULSO-${{ env.RELEASE_TAG }}-windows-x64
          if-no-files-found: error
          path: |
            dist/PULSO-*-windows-x64-setup.exe
            dist/PULSO-*-windows-x64-setup.exe.sha256
            dist/PULSO-*-windows-x64.zip
            dist/PULSO-*-windows-x64.zip.sha256
            dist/*-sbom.cdx.json
      - name: Publish unsigned beta GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:RELEASE_TAG dist/PULSO-*-windows-x64-setup.exe dist/PULSO-*-windows-x64-setup.exe.sha256 dist/PULSO-*-windows-x64.zip dist/PULSO-*-windows-x64.zip.sha256 dist/*-sbom.cdx.json --verify-tag --notes-file docs/UNSIGNED_BETA_RELEASE.md --title "PULSO $($env:RELEASE_TAG.TrimStart('v')) — BETA SIN FIRMA DIGITAL"
